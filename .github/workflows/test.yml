name: Test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./... -count=1
      - run: go vet ./...
      - name: Scan for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Native Windows extracted-binary onboarding smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-onboarding.ps1
      - name: Native Windows isolated runtime and task smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-runtime.ps1
